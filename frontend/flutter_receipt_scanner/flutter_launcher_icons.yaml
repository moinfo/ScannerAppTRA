flutter_icons:
  android: true  # Generate Android icons
  ios: true      # Generate iOS icons
  image_path: "assets/icon/lemurulogo.png"  # Path to your icon file
  adaptive_icon_background: "#ffffff"     # Color for Android adaptive icon background
  adaptive_icon_foreground: "assets/icon/lemurulogo.png"  # Android adaptive icon foreground
  min_sdk_android: 21 # Android min sdk version
  remove_alpha_ios: true # Remove alpha channel for iOS
  web:
    generate: true
    image_path: "assets/icon/lemurulogo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icon/lemurulogo.png"
    icon_size: 48 # Min size for Windows icons
  macos:
    generate: true
    image_path: "assets/icon/lemurulogo.png"